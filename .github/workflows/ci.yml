name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Check formatting (Prettier)
        run: bun run format:check

      - name: Typecheck (TypeScript)
        run: bun run typecheck

      - name: Lint (ESLint)
        run: bun run lint

      - name: Verify Next.js Build
        run: bun run build
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/mcp_db"
          BETTER_AUTH_SECRET: "ci_dummy_secret_ci_dummy_secret_32_chars_min"
          BETTER_AUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_TELEMETRY_DISABLED: "1"
